  </defs>

  <rect width="960" height="420" rx="16" fill="url(#cardBg)" stroke="#262626" stroke-width="1"/>

  <text x="40" y="48" fill="#71717A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.18em">CURRENT MISSION</text>
  <text x="40" y="88" fill="#FAFAFA" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.02em">Atlas AI - Road to Launch</text>
  <text x="40" y="118" fill="#A1A1AA" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Intelligent automation platform for teams that ship.</text>

  <rect x="820" y="34" width="100" height="28" rx="14" fill="#161616" stroke="#30363D" stroke-width="1"/>
  <text x="870" y="53" text-anchor="middle" fill="#0066FF" font-family="ui-monospace, monospace" font-size="12" font-weight="600">v0.8.0</text>

  <text x="40" y="168" fill="#D4D4D8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500">Launch Progress</text>
  <text x="920" y="168" text-anchor="end" fill="#0066FF" font-family="ui-monospace, monospace" font-size="13" font-weight="600">68%</text>
  <rect x="40" y="182" width="880" height="6" rx="3" fill="#1F1F1F"/>
