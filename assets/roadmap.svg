  <rect x="40" y="214" width="200" height="88" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="56" y="244" fill="#71717A" font-family="ui-sans-serif, sans-serif" font-size="11" letter-spacing="0.08em">USERS</text>
  <text x="56" y="278" fill="#FAFAFA" font-family="ui-sans-serif, sans-serif" font-size="26" font-weight="600">240</text>
  <text x="56" y="296" fill="#52525B" font-family="ui-sans-serif, sans-serif" font-size="11">Goal: 1,000</text>

  <rect x="260" y="214" width="200" height="88" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
