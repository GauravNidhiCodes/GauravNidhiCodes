  <circle cx="336" cy="378" r="5" fill="#3F3F46"/>
  <text x="352" y="383" fill="#A1A1AA" font-family="ui-sans-serif, sans-serif" font-size="13">Public beta access</text>

  <circle cx="576" cy="378" r="5" fill="#3F3F46"/>
  <text x="592" y="383" fill="#A1A1AA" font-family="ui-sans-serif, sans-serif" font-size="13">Billing and subscriptions</text>

  <circle cx="816" cy="378" r="5" fill="#3F3F46"/>
  <text x="832" y="383" fill="#A1A1AA" font-family="ui-sans-serif, sans-serif" font-size="13">Launch v1.0</text>
