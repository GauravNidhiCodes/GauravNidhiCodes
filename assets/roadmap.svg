  <text x="276" y="278" fill="#FAFAFA" font-family="ui-sans-serif, sans-serif" font-size="26" font-weight="600">$10K</text>
  <text x="276" y="296" fill="#52525B" font-family="ui-sans-serif, sans-serif" font-size="11">Current: $1.2K</text>

  <rect x="480" y="214" width="200" height="88" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="496" y="244" fill="#71717A" font-family="ui-sans-serif, sans-serif" font-size="11" letter-spacing="0.08em">VERSION</text>
  <text x="496" y="278" fill="#FAFAFA" font-family="ui-sans-serif, sans-serif" font-size="26" font-weight="600">0.8</text>
  <text x="496" y="296" fill="#52525B" font-family="ui-sans-serif, sans-serif" font-size="11">Beta / Private</text>

  <rect x="700" y="214" width="220" height="88" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="716" y="244" fill="#71717A" font-family="ui-sans-serif, sans-serif" font-size="11" letter-spacing="0.08em">TARGET LAUNCH</text>
  <text x="716" y="278" fill="#FAFAFA" font-family="ui-sans-serif, sans-serif" font-size="26" font-weight="600">Q3 2026</text>
  <text x="716" y="296" fill="#52525B" font-family="ui-sans-serif, sans-serif" font-size="11">Public release</text>

  <text x="40" y="348" fill="#71717A" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="600" letter-spacing="0.14em">UPCOMING MILESTONES</text>

