<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 1200" fill="none" role="img" aria-label="Gaurav Nidhi profile hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="3840" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="50%" stop-color="#070D1A"/>
      <stop offset="100%" stop-color="#050911"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(2820 500) rotate(90) scale(560 1080)">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 180) rotate(32) scale(500 900)">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M84 0H0V84" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" fill="none"/>
    </pattern>
    <clipPath id="clip">
      <rect width="3840" height="1200" rx="28"/>
    </clipPath>
    <style>
      .panel {
        transition: transform 0.35s ease, opacity 0.35s ease;
      }
      svg:hover .panel {
        transform: translateY(-6px);
        opacity: 1;
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="3840" height="1200" fill="url(#bg)"/>
    <rect width="3840" height="1200" fill="url(#grid)"/>
    <rect width="3840" height="1200" fill="url(#glowA)"/>
    <rect width="3840" height="1200" fill="url(#glowB)"/>

    <rect x="160" y="1050" width="3520" height="2" fill="url(#line)" opacity="0.65">
      <animate attributeName="opacity" values="0.35;0.85;0.35" dur="8s" repeatCount="indefinite"/>
    </rect>

    <g class="panel" opacity="0.96">
      <circle cx="320" cy="250" r="74" fill="#2563EB" fill-opacity="0.14" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="320" cy="250" r="19" fill="#3B82F6">
        <animate attributeName="opacity" values="0.65;1;0.65" dur="2.8s" repeatCount="indefinite"/>
      </circle>

      <text x="450" y="190" fill="#93C5FD" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="36" font-weight="600" letter-spacing="0.28em">GAURAV NIDHI</text>
      <text x="450" y="360" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="156" font-weight="700" letter-spacing="-0.035em">Building Atlas AI</text>
      <text x="450" y="470" fill="#B9C2CF" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="500">AI Engineering | Full Stack Development</text>

      <rect x="450" y="560" width="980" height="96" rx="48" fill="#0B1220" stroke="#1E293B" stroke-width="2"/>
      <circle cx="520" cy="608" r="11" fill="#22C55E">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="555" y="623" fill="#DDE5F2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="600">Learning by building real products</text>

      <text x="3610" y="190" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" letter-spacing="0.12em">PROFILE README 2026</text>
    </g>
  </g>
</svg>
