<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Gaurav Nidhi - Atlas AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0066FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" fill="none"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <rect x="0" y="0" width="1200" height="320" fill="url(#glow)" opacity="0.4">
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="8s" repeatCount="indefinite"/>
    </rect>

    <rect x="64" y="248" width="1072" height="1" fill="url(#line)" opacity="0.6">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="6s" repeatCount="indefinite"/>
    </rect>

    <circle cx="96" cy="96" r="28" stroke="#0066FF" stroke-width="1.5" fill="#0066FF" fill-opacity="0.08"/>
    <circle cx="96" cy="96" r="8" fill="#0066FF">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>

    <text x="144" y="88" fill="#FAFAFA" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="500" letter-spacing="0.28em">GAURAV NIDHI</text>
    <text x="144" y="148" fill="#FAFAFA" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="600" letter-spacing="-0.03em">Building Atlas AI</text>
    <text x="144" y="188" fill="#A1A1AA" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="400">AI Engineer / Full Stack Developer</text>

    <rect x="144" y="212" width="132" height="28" rx="14" fill="#161616" stroke="#262626" stroke-width="1"/>
    <circle cx="162" cy="226" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="176" y="231" fill="#D4D4D8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500">Available for work</text>

    <text x="1136" y="56" text-anchor="end" fill="#52525B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.12em">2026</text>
  </g>
</svg>
